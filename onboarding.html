<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>캐릭터 선택</title>
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <div id="onboarding-wrap">
    <button id="close-btn">×</button>
    <p id="onboarding-title">어떤 친구랑 함께할까요?</p>
    <div id="character-grid">
      <div class="char-card" data-id="nudi">
        <img src="assets/characters/nudi-preview.png" alt="누디" onerror="this.style.display='none'">
        <span class="char-name">누디</span>
      </div>
      <div class="char-card" data-id="cat">
        <img src="assets/characters/cat-preview.png" alt="냐냐" onerror="this.style.display='none'">
        <span class="char-name">냐냐</span>
      </div>
      <div class="char-card" data-id="rabbit">
        <img src="assets/characters/rabbit-preview.png" alt="토찌" onerror="this.style.display='none'">
        <span class="char-name">토찌</span>
      </div>
      <div class="char-card" data-id="leaf">
        <img src="assets/characters/leaf-preview.png" alt="망이" onerror="this.style.display='none'">
        <span class="char-name">망이</span>
      </div>
    </div>
    <button id="start-btn" disabled>시작하기</button>
  </div>
  <script src="onboarding.js"></script>
</body>
</html>
